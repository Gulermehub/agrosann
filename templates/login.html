{% extends 'base.html' %}{% block content %}<h2>Entrar no AgroSan</h2>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="username">Usuário</label>
<input id="username" name="username" maxlength="80" autocomplete="username" required>
<label for="password">Senha</label>
<input id="password" name="password" type="password" maxlength="128" autocomplete="current-password" required>
<button type="submit">Entrar</button>
<p>Ainda não tem conta? <a href="{{ url_for('web.register') }}">Criar minha conta</a></p>
</form>{% endblock %}
